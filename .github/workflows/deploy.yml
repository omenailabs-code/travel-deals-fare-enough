name: Deploy to Cloudflare Pages

on:
  # Run twice daily (6 AM and 6 PM UTC)
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC
    - cron: '0 18 * * *'  # 6 PM UTC
  # Also trigger on push to main
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install lxml httpx pillow

      - name: Run deal scraping and anomaly detection
        run: |
          python dealengine/check.py --mode full

      - name: Rebuild deals.json from database
        run: |
          python rebuild_deals.py

      - name: Generate deal descriptions
        run: |
          python dealengine/content_gen.py

      - name: Install frontend dependencies
        run: |
          npm install

      - name: Build site
        run: |
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: travel-deals-fare-enough
          directory: dist
          entrypoint: npm run build
